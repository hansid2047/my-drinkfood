<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧋 辦公室飲料或餐點揪團</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --green:    #1B8A5A;
  --green-d:  #146645;
  --green-l:  #D1FAE5;
  --mint:     #A7F3D0;
  --lime:     #ECFDF5;
  --amber:    #F59E0B;
  --amber-l:  #FEF3C7;
  --red:      #EF4444;
  --red-l:    #FEE2E2;
  --blue:     #3B82F6;
  --blue-l:   #DBEAFE;
  --orange:   #F97316;
  --orange-l: #FFEDD5;
  --ink:      #0F2B1F;
  --muted:    #6B7280;
  --border:   #D1D5DB;
  --card:     #FFFFFF;
  --bg:       #F0FDF6;
  --radius:   16px;
  --shadow:   0 4px 24px rgba(27,138,90,.10);
  --shadow-lg:0 8px 40px rgba(27,138,90,.18);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans TC','Nunito',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:'';position:fixed;top:-120px;right:-120px;
  width:400px;height:400px;
  background:radial-gradient(circle,#A7F3D080,transparent 70%);
  border-radius:50%;pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:-100px;left:-80px;
  width:340px;height:340px;
  background:radial-gradient(circle,#D1FAE580,transparent 70%);
  border-radius:50%;pointer-events:none;z-index:0;
}

/* ── Header ── */
.header{
  background:linear-gradient(135deg,#1B8A5A 0%,#059669 50%,#0D9488 100%);
  padding:22px 32px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(27,138,90,.3);
}
.header-brand{display:flex;align-items:center;gap:12px}
.brand-icon{font-size:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.brand-text .title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.02em;font-family:'Nunito',sans-serif}
.brand-text .sub{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.08em;margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}

/* ── Tab Bar ── */
.tab-bar{
  background:#fff;
  border-bottom:2px solid #E5E7EB;
  display:flex;padding:0 28px;
  position:sticky;top:66px;z-index:90;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  overflow-x:auto;gap:4px;
}
.tab{
  border:none;background:none;
  padding:14px 22px;font-size:14px;font-weight:700;
  color:#9CA3AF;white-space:nowrap;
  position:relative;transition:color .2s;
  font-family:'Nunito',sans-serif;
  display:flex;align-items:center;gap:6px;
}
.tab.active{color:var(--green)}
.tab.active::after{
  content:'';position:absolute;bottom:-2px;left:0;right:0;
  height:3px;background:var(--green);border-radius:3px 3px 0 0;
}
.tab-badge{
  background:var(--red);color:#fff;
  border-radius:99px;font-size:10px;font-weight:900;
  padding:1px 6px;min-width:18px;text-align:center;
}

/* ── Content ── */
.content{padding:28px 32px;position:relative;z-index:1}
.page-title{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:4px;font-family:'Nunito',sans-serif}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:26px}

/* ── Session cards ── */
.sessions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:24px}
.session-card{
  background:var(--card);border-radius:var(--radius);
  padding:20px 22px;border:2px solid transparent;
  box-shadow:var(--shadow);cursor:pointer;
  transition:all .2s;position:relative;overflow:hidden;
}
.session-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--green),#0D9488);
}
.session-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.session-card.closed{opacity:.6;cursor:default}
.session-card.closed::before{background:#9CA3AF}
.session-name{font-size:17px;font-weight:900;margin-bottom:4px;font-family:'Nunito',sans-serif}
.session-meta{font-size:13px;color:var(--muted);line-height:1.8}
.session-status{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;margin-top:8px;
}
.status-open{background:var(--green-l);color:var(--green-d)}
.status-closed{background:#F3F4F6;color:#6B7280}
.status-dot{width:7px;height:7px;border-radius:50%;animation:pulse 1.5s infinite}
.status-open .status-dot{background:var(--green)}
.status-closed .status-dot{background:#9CA3AF;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Forms ── */
.form-card{
  background:var(--card);border-radius:var(--radius);
  padding:28px 30px;box-shadow:var(--shadow);
  border:1px solid #E5E7EB;max-width:680px;
}
.form-section-title{
  font-size:13px;font-weight:800;color:var(--green);
  letter-spacing:.08em;text-transform:uppercase;
  margin:22px 0 14px;padding-bottom:8px;border-bottom:1.5px solid var(--green-l);
}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{margin-bottom:14px}
label.lbl{display:block;font-size:12px;font-weight:800;color:#374151;margin-bottom:6px;letter-spacing:.03em}
.required::after{content:" *";color:var(--red);font-weight:900}

input[type=text],input[type=number],input[type=datetime-local],select,textarea{
  width:100%;border:1.5px solid var(--border);border-radius:10px;
  padding:10px 14px;font-size:14px;background:#FAFAFA;
  color:var(--ink);outline:none;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--green);box-shadow:0 0 0 3px rgba(27,138,90,.12);background:#fff;
}
textarea{resize:vertical;min-height:60px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:1}

/* ── Toggle checkbox block ── */
.order-type-block{
  border:2px solid var(--border);
  border-radius:14px;
  margin-bottom:16px;
  overflow:hidden;
  transition:border-color .2s;
}
.order-type-block.active-drink{ border-color:var(--green); }
.order-type-block.active-food{ border-color:var(--orange); }
.order-type-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  cursor:pointer;
  background:#FAFAFA;
  user-select:none;
  transition:background .2s;
}
.order-type-header:hover{background:#F3F4F6}
.order-type-block.active-drink .order-type-header{background:var(--green-l)}
.order-type-block.active-food .order-type-header{background:var(--orange-l)}
.order-type-checkbox{
  width:22px;height:22px;
  border:2.5px solid var(--border);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:all .18s;
  flex-shrink:0;
  background:#fff;
}
.order-type-block.active-drink .order-type-checkbox{background:var(--green);border-color:var(--green);color:#fff;}
.order-type-block.active-food .order-type-checkbox{background:var(--orange);border-color:var(--orange);color:#fff;}
.order-type-label{
  font-size:16px;font-weight:900;font-family:'Nunito',sans-serif;
}
.order-type-sub{font-size:12px;color:var(--muted);margin-left:auto}
.order-type-content{
  padding:18px 18px 20px;
  border-top:1.5px solid #E5E7EB;
  display:none;
}
.order-type-block.active-drink .order-type-content,
.order-type-block.active-food .order-type-content{
  display:block;
}

/* ── Note sub-fields ── */
.note-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note-field label.lbl{color:#6B7280;font-size:11px}
.note-field input{font-size:13px;padding:8px 12px;background:#FAFAFA}

/* ── Announcement block ── */
.announce-block{
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:var(--shadow);
  border:1.5px solid var(--mint);
}
.announce-header{
  background:linear-gradient(135deg,#1B8A5A,#059669);
  padding:12px 20px;
  display:flex;align-items:center;gap:8px;
  color:#fff;font-weight:800;font-size:14px;
  font-family:'Nunito',sans-serif;
}
.announce-body{
  background:#fff;
  padding:16px 20px;
}
.announce-text{
  font-size:14px;line-height:1.8;color:var(--ink);
  white-space:pre-wrap;margin-bottom:12px;
}
.announce-text:empty{display:none}

/* ── Chip selectors ── */
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{
  border:1.5px solid var(--border);background:#fff;
  border-radius:99px;padding:6px 16px;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .18s;font-family:'Nunito',sans-serif;
  color:#6B7280;
}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.selected{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.chip.selected-food{border-color:var(--orange);background:var(--orange-l);color:#9A3412}

/* ── Buttons ── */
.btn{
  border:none;border-radius:12px;padding:11px 22px;
  font-size:14px;font-weight:800;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:all .2s;
  display:inline-flex;align-items:center;gap:7px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--green),#059669);
  color:#fff;box-shadow:0 4px 14px rgba(27,138,90,.35);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(27,138,90,.45)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:#fff;border:2px solid var(--green);color:var(--green)}
.btn-outline:hover{background:var(--green-l)}
.btn-ghost{background:#F9FAFB;border:1.5px solid var(--border);color:#6B7280}
.btn-ghost:hover{background:#F3F4F6}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#DC2626}
.btn-amber{background:var(--amber);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:8px}
.btn-full{width:100%;justify-content:center}

/* ── Order list ── */
.orders-wrap{max-width:820px}
.order-summary-bar{
  background:linear-gradient(135deg,var(--green),#059669);
  border-radius:var(--radius);padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;color:#fff;flex-wrap:wrap;gap:12px;
}
.summary-stat{text-align:center}
.summary-stat .val{font-size:26px;font-weight:900;font-family:'Nunito',sans-serif}
.summary-stat .lbl{font-size:11px;opacity:.8}
.order-table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid #E5E7EB}
.order-table{width:100%;border-collapse:collapse;font-size:14px}
.order-table th{
  background:#F0FDF6;padding:12px 16px;text-align:left;
  font-size:12px;font-weight:800;color:var(--green-d);letter-spacing:.05em;
  border-bottom:2px solid var(--mint);white-space:nowrap;
}
.order-table td{padding:12px 16px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
.order-table tr:last-child td{border-bottom:none}
.order-table tr:hover td{background:#F9FAFB}
.total-row td{background:var(--lime)!important;font-weight:800;border-top:2px solid var(--mint)}

.drink-name{font-weight:700;color:var(--ink)}
.price-cell{font-weight:800;color:var(--green-d);font-family:'Nunito',sans-serif}
.tag-sm{
  display:inline-block;border-radius:99px;padding:2px 9px;
  font-size:11px;font-weight:700;white-space:nowrap;
}
.tag-size{background:#DBEAFE;color:#1D4ED8}
.tag-ice{background:#E0F2FE;color:#0369A1}
.tag-sugar{background:var(--amber-l);color:#B45309}
.tag-food{background:var(--orange-l);color:#9A3412}

/* ── New session form ── */
.create-session-btn{
  background:linear-gradient(135deg,var(--amber),#D97706);
  color:#fff;border:none;border-radius:12px;padding:11px 22px;
  font-size:14px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 4px 14px rgba(245,158,11,.3);transition:all .2s;
}
.create-session-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,158,11,.4)}

/* ── Alerts ── */
.info-box{background:var(--green-l);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--green-d);margin-bottom:16px;border:1px solid var(--mint);display:flex;gap:8px;align-items:flex-start}
.warn-box{background:var(--amber-l);border-radius:10px;padding:12px 16px;font-size:13px;color:#92400E;margin-bottom:16px;border:1px solid #FCD34D;display:flex;gap:8px;align-items:flex-start}
.error-box{background:var(--red-l);border-radius:10px;padding:10px 14px;font-size:13px;color:#991B1B;margin-bottom:14px;border:1px solid #FCA5A5}
.success-box{background:var(--green-l);border-radius:12px;padding:20px;text-align:center;border:1px solid var(--mint)}

/* ── Empty ── */
.empty{text-align:center;color:#D1D5DB;padding:60px 20px}
.empty .emo{font-size:48px;margin-bottom:12px}
.empty p{font-size:15px;color:#9CA3AF;margin-bottom:20px}

/* ── Modal ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(3px);
}
.modal{
  background:#fff;border-radius:20px;width:100%;max-width:540px;
  max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 26px 16px;border-bottom:1.5px solid #F3F4F6;
  position:sticky;top:0;background:#fff;border-radius:20px 20px 0 0;z-index:10;
}
.modal-head h3{font-size:18px;font-weight:900;font-family:'Nunito',sans-serif}
.modal-close{
  border:none;background:#F3F4F6;border-radius:99px;
  width:32px;height:32px;font-size:16px;color:#6B7280;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.modal-body{padding:20px 26px 28px}

/* ── Header button ── */
.btn-hdr{
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);
  border-radius:10px;color:#fff;padding:7px 16px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:'Nunito',sans-serif;transition:background .2s;
}
.btn-hdr:hover{background:rgba(255,255,255,.28)}

/* ── Toast ── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:#0F2B1F;color:#fff;border-radius:14px;
  padding:13px 26px;font-size:14px;font-weight:700;
  box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:900;white-space:nowrap;
  animation:fadeUp .3s ease;font-family:'Nunito',sans-serif;
}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── Loading ── */
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:#9CA3AF;padding:50px;font-size:14px}

/* ── Menu panel ── */
.menu-panel{
  background:#fff;border-radius:var(--radius);
  border:2px solid var(--mint);
  padding:20px 24px;margin-bottom:20px;
  box-shadow:var(--shadow);
}
.menu-panel-title{
  font-size:14px;font-weight:900;color:var(--green-d);
  margin-bottom:14px;font-family:'Nunito',sans-serif;
  display:flex;align-items:center;gap:6px;
}
.menu-link-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--green),#059669);
  color:#fff;text-decoration:none;
  border-radius:10px;padding:10px 18px;
  font-size:14px;font-weight:800;font-family:'Nunito',sans-serif;
  box-shadow:0 3px 12px rgba(27,138,90,.3);
  transition:all .2s;margin-bottom:14px;
}
.menu-link-btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(27,138,90,.4)}
.menu-link-arrow{font-size:16px;transition:transform .2s}
.menu-link-btn:hover .menu-link-arrow{transform:translate(2px,-2px)}
.menu-img-wrap{
  border-radius:12px;overflow:hidden;
  border:1.5px solid var(--border);
  position:relative;background:#F9FAFB;cursor:zoom-in;
}
.menu-img{
  width:100%;max-height:360px;object-fit:contain;
  display:block;transition:transform .3s;
}
.menu-img-wrap:hover .menu-img{transform:scale(1.01)}
.menu-img-hint{
  text-align:center;font-size:11px;color:#9CA3AF;
  padding:6px;background:#F9FAFB;border-top:1px solid #F3F4F6;
}
.menu-img-err{
  padding:20px;text-align:center;font-size:13px;color:#9CA3AF;background:#FAFAFA;
}

/* ── Lightbox ── */
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  z-index:800;display:flex;align-items:center;justify-content:center;
  padding:20px;cursor:zoom-out;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lightbox img{
  max-width:100%;max-height:100%;border-radius:8px;
  box-shadow:0 0 60px rgba(0,0,0,.5);
  object-fit:contain;
}
.lightbox-close{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,.15);border:none;color:#fff;
  border-radius:99px;width:38px;height:38px;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* ── Back button ── */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--green);font-weight:800;font-size:13px;
  border:none;background:none;cursor:pointer;margin-bottom:20px;
  padding:6px 0;font-family:'Nunito',sans-serif;
}
.back-btn:hover{text-decoration:underline}

/* ── Price highlight ── */
.price-input-wrap{position:relative}
.price-input-wrap input{padding-right:32px}
.price-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:#9CA3AF;font-weight:700;pointer-events:none}

/* ── Textarea for announcement ── */
.announce-textarea{
  width:100%;border:1.5px solid var(--border);border-radius:10px;
  padding:10px 14px;font-size:14px;background:#FAFAFA;
  color:var(--ink);outline:none;font-family:inherit;
  resize:vertical;min-height:80px;
  transition:border-color .2s,box-shadow .2s;
}
.announce-textarea:focus{
  border-color:var(--green);box-shadow:0 0 0 3px rgba(27,138,90,.12);background:#fff;
}

/* ── Responsive ── */
@media(max-width:640px){
  .header{padding:14px 16px}
  .brand-text .title{font-size:17px}
  .content{padding:16px 14px}
  .tab-bar{padding:0 8px;top:58px}
  .tab{padding:11px 14px;font-size:12px}
  .form-row,.form-row.three{grid-template-columns:1fr}
  .form-card{padding:20px 18px}
  .sessions-grid{grid-template-columns:1fr}
  .order-summary-bar{flex-direction:column;gap:16px;text-align:center}
  .order-table{font-size:12px}
  .order-table th,.order-table td{padding:10px 10px}
  .note-grid{grid-template-columns:1fr}
}
</style>
</head>

<div id="app"></div>

<script>
// ════════════════════════════════════════════════════════

const GAS_URL = "https://script.google.com/macros/s/AKfycbwfkTGoe7oIDQlB7c7FLqYqnQ1-iRIQcD_K8HiltCP-tK8ayCVEFoELueXd1CcLeqr0yw/exec";

    window[cb] = (data) => {
      clearTimeout(tid); delete window[cb];
      document.getElementById("_s_"+cb)?.remove();
      resolve(data);
    };
    const qs  = new URLSearchParams({ ...params, callback: cb }).toString();
    const el  = document.createElement("script");
    el.id     = "_s_" + cb;
    el.src    = GAS_URL + "?" + qs;
    el.onerror = () => { clearTimeout(tid); delete window[cb]; reject(new Error("network")); };
    document.head.appendChild(el);
  });
}
async function gas(params) {
  try { return await jsonp(params); }
  catch(e) { console.error(e); return { ok:false, error:e.message }; }
}

async function loadSessions() {
  S.loading = true; render();

  S.loading = false; render();
}

  const r = await gas({ action:"getOrders", sessionId: sessionId||"" });

}

// ── Helpers ───────────────────────────────────────────
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;") }
function toast(msg){
  S.toast=msg; clearTimeout(S.toastTimer);
  S.toastTimer=setTimeout(()=>{ S.toast=null; document.querySelectorAll(".toast").forEach(e=>e.remove()); },2800);
  document.querySelectorAll(".toast").forEach(e=>e.remove());
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
}
function now15(){ const d=new Date(); d.setMinutes(d.getMinutes()+15-d.getSeconds()/60); return d.toISOString().slice(0,16); }
function fmtPrice(n){ return parseInt(n||0).toLocaleString(); }

function buildNoteDisplay(o) {
  const parts = [];
  if (o.size && o.size !== "X") parts.push(`<span class="tag-sm tag-size">${esc(o.size)}</span>`);
  if (o.ice  && o.ice  !== "X") parts.push(`<span class="tag-sm tag-ice">${esc(o.ice)}</span>`);
  if (o.sugar && o.sugar !== "X") parts.push(`<span class="tag-sm tag-sugar">${esc(o.sugar)}</span>`);
  const noteParts = [];
  if (o.drinkTopping) noteParts.push("加料：" + o.drinkTopping);
  if (o.drinkSugarNote) noteParts.push("甜度備註：" + o.drinkSugarNote);
  if (o.drinkOther) noteParts.push(o.drinkOther);
  if (o.foodCombo) noteParts.push("套餐：" + o.foodCombo);
  if (o.foodSpecial) noteParts.push("特殊：" + o.foodSpecial);
  if (o.commonNote) noteParts.push(o.commonNote);
  const tagStr = parts.join(" ");
  const noteStr = noteParts.length ? `<span style="display:block;margin-top:3px">${esc(noteParts.join(" / "))}</span>` : "";
  return (tagStr || noteStr) ? tagStr + noteStr : "—";
}

          <div style="font-size:12px;font-weight:800;color:var(--green);letter-spacing:.07em;margin-bottom:10px">📢 主辦人公告（顯示在訂單頁最上方）</div>
          <div class="form-group">
            <label class="lbl">公告文字</label>
            <textarea class="announce-textarea" placeholder="可以在這裡寫給訂購者的說明，例如：今天揪五十嵐，想喝熱的要特別備註！" oninput="S.sessionForm.announcementText=this.value">${esc(f.announcementText)}</textarea>
          </div>
          <div class="form-group">
            <label class="lbl">公告圖片網址</label>
            <input type="text" placeholder="例：https://i.imgur.com/xxxxx.jpg" value="${esc(f.menuImg)}" oninput="S.sessionForm.menuImg=this.value">
            <div style="font-size:11px;color:#9CA3AF;margin-top:5px">支援任何圖片網址（建議使用 Imgur 上傳圖片）</div>
            ${f.menuImg ? `<div style="margin-top:10px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)">
              <img src="${esc(f.menuImg)}" alt="公告圖片預覽" style="width:100%;max-height:200px;object-fit:contain;background:#FAFAFA;display:block" onerror="this.style.display='none'">
            </div>` : ""}
          </div>

          <div style="border-top:1.5px solid #F0FDF4;margin:18px 0 16px"></div>

          <!-- ── 場次基本資料 ── -->
          <div style="font-size:12px;font-weight:800;color:var(--green);letter-spacing:.07em;margin-bottom:14px">📋 場次基本資料</div>
          <div class="form-group">
            <label class="lbl required">場次名稱</label>
            <input type="text" id="s_name" placeholder="例：0601 下午茶揪團" value="${esc(f.name)}" oninput="S.sessionForm.name=this.value">
          </div>
          <div class="form-group">
            <label class="lbl required">主辦人姓名</label>
            <input type="text" id="s_host" placeholder="你的名字" value="${esc(f.host)}" oninput="S.sessionForm.host=this.value">
          </div>
          <div class="form-group">
            <label class="lbl">店家名稱</label>
            <input type="text" id="s_store" placeholder="例：五十嵐、清心、一芳" value="${esc(f.store)}" oninput="S.sessionForm.store=this.value">
          </div>
          <div class="form-group">
            <label class="lbl">截止時間</label>
            <input type="datetime-local" id="s_deadline" value="${esc(f.deadline||now15())}" oninput="S.sessionForm.deadline=this.value">
          </div>

          <div style="border-top:1.5px solid #F0FDF4;margin:18px 0 16px"></div>

          <!-- ── 菜單連結 ── -->
          <div style="font-size:12px;font-weight:800;color:var(--green);letter-spacing:.07em;margin-bottom:14px">🔗 菜單連結（選填）</div>
          <div class="form-group">
            <label class="lbl">菜單連結網址</label>
            <input type="text" id="s_menuUrl" placeholder="例：https://www.50lan.com.tw/menu" value="${esc(f.menuUrl)}" oninput="S.sessionForm.menuUrl=this.value">
            <div style="font-size:11px;color:#9CA3AF;margin-top:5px">訂購者可點此連結查看完整菜單</div>
          </div>

          <div id="session_err"></div>
          <button class="btn btn-primary btn-full" id="session_submit" onclick="submitSession()">
            🚀 建立場次
          </button>
        </div>
      </div>
    </div>`;
  }
  return "";
}

// ── Actions ───────────────────────────────────────────
function setTab(t) {
  S.tab = t;
  if (t==="manage") refreshManage();
  else { loadSessions(); S.currentSession=null; }
  render();
}

function selectSession(id) {
  const sess = S.sessions.find(s=>s.sessionId===id);
  if (!sess || sess.status!=="開放中") return;
  S.currentSession = sess;
  S.orderForm = { name:S.orderForm.name, wantDrink:false, drink:"", size:"中杯", ice:"少冰", sugar:"7分糖",
    drinkTopping:"", drinkSugarNote:"", drinkOther:"",
    wantFood:false, food:"", foodQty:"1", foodCombo:"", foodSpecial:"",
    ext:"", commonNote:"", price:"" };
  window.scrollTo(0,0);
  render();
}

function backToSessions() {
  S.currentSession = null;
  render();
}

function openNewSession() {
  S.modal = "newSession";
  S.sessionForm = { name:"", host:"", store:"", deadline:now15(), announcementText:"", menuUrl:"", menuImg:"" };
  render();
}
function closeModal()     { S.modal=null; render(); }
function setFilterSession(v) { S.filterSession=v; render(); }

async function refreshManage() {
  S.loading=true; render();
  const [sr, or] = await Promise.all([
    gas({ action:"getSessions" }),
    gas({ action:"getOrders" }),
  ]);
  if (sr?.ok) S.sessions = sr.data||[];
  if (or?.ok) S.orders   = or.data||[];
  S.loading=false; render();
}

async function submitOrder() {
  const f = S.orderForm;
  let err = "";
  if (!f.name.trim()) { err="請填寫訂購者姓名"; }
  else if (!f.wantDrink && !f.wantFood) { err="請至少勾選「飲料」或「餐點」其中一項"; }
  else if (f.wantDrink && !f.drink.trim()) { err="請填寫飲料名稱"; }
  else if (f.wantFood && !f.food.trim()) { err="請填寫餐點名稱"; }
  else if (!f.price || isNaN(f.price) || parseInt(f.price)<0) { err="請填寫正確的金額"; }

  const errEl = document.getElementById("order_err");
  if (err) { if(errEl) errEl.innerHTML=`<div class="error-box">⚠ ${esc(err)}</div>`; return; }
  if(errEl) errEl.innerHTML="";

  S.submitting=true; render();
  const r = await gas({
    action:      "addOrder",
    sessionId:   S.currentSession.sessionId,
    sessionName: S.currentSession.name,
    name:        f.name,
    // 飲料
    drink:       f.wantDrink ? f.drink : "",
    size:        f.wantDrink ? f.size  : "",
    ice:         f.wantDrink ? f.ice   : "",
    sugar:       f.wantDrink ? f.sugar : "",
    drinkTopping:    f.wantDrink ? f.drinkTopping   : "",
    drinkSugarNote:  f.wantDrink ? f.drinkSugarNote : "",
    drinkOther:      f.wantDrink ? f.drinkOther     : "",
    // 餐點
    food:         f.wantFood ? f.food      : "",
    foodQty:      f.wantFood ? f.foodQty   : "",
    foodCombo:    f.wantFood ? f.foodCombo : "",
    foodSpecial:  f.wantFood ? f.foodSpecial : "",
    // 共通
    ext:         f.ext,
    note:        f.commonNote,
    price:       f.price,
  });
  S.submitting=false;

  if (r?.ok) {
    const prevName = f.name;
    S.orderForm = { name:prevName, wantDrink:false, drink:"", size:"中杯", ice:"少冰", sugar:"7分糖",
      drinkTopping:"", drinkSugarNote:"", drinkOther:"",
      wantFood:false, food:"", foodQty:"1", foodCombo:"", foodSpecial:"",
      ext:"", commonNote:"", price:"" };
    S.currentSession=null;
    toast("✅ 訂單已送出！已記錄到 Google 試算表 🎉");
    await loadSessions();
    render();
  } else {
    const e2=document.getElementById("order_err");
    if(e2) e2.innerHTML=`<div class="error-box">⚠ 送出失敗，請稍後再試（${esc(r?.error||"")}）</div>`;
  }
}

async function submitSession() {
  const f = S.sessionForm;
  const errEl = document.getElementById("session_err");
  if (!f.name.trim()||!f.host.trim()) { if(errEl)errEl.innerHTML=`<div class="error-box">⚠ 請填寫場次名稱和主辦人</div>`; return; }
  const btn = document.getElementById("session_submit");
  if(btn){btn.disabled=true;btn.textContent="建立中…";}
  const r = await gas({
    action: "addSession",
    name:   f.name,
    host:   f.host,
    store:  f.store,
    deadline: f.deadline,
    announcementText: f.announcementText||"",
    menuUrl: f.menuUrl||"",
    menuImg: f.menuImg||"",
  });
  if(btn){btn.disabled=false;btn.textContent="🚀 建立場次";}
  if (r?.ok) {
    closeModal();
    toast("🎉 揪團場次已建立！");
    await refreshManage();
  } else {
    if(errEl)errEl.innerHTML=`<div class="error-box">⚠ 建立失敗，請稍後再試</div>`;
  }
}

async function doCloseSession(id, name) {
  if (!confirm(`確定要截止「${name}」的訂單嗎？截止後同事將無法再新增訂單。`)) return;
  const r = await gas({ action:"closeSession", sessionId:id });
  if (r?.ok) { toast("🔒 訂單已截止"); await refreshManage(); }
}

function copyOrders() {
  const f = S.filterSession;
  const list = (f==="all"?S.orders:S.orders.filter(o=>o.sessionId===f));
  if (!list.length) { toast("❌ 沒有訂單可以複製"); return; }
  const lines = list.map((o,i)=>{
    const parts = [];
    if (o.drink) parts.push(`飲料：${o.drink} ${o.size||""} ${o.ice||""} ${o.sugar||""}`.trim());
    if (o.food)  parts.push(`餐點：${o.food}${o.foodQty&&o.foodQty!="1"?" ×"+o.foodQty:""}`);
    const noteArr = [o.drinkTopping,o.drinkSugarNote,o.drinkOther,o.foodCombo,o.foodSpecial,o.commonNote].filter(Boolean);
    const noteStr = noteArr.length ? ` (${noteArr.join(" / ")})` : "";
    return `${i+1}. ${o.name}｜${parts.join(" ＋ ")}${noteStr}｜$${o.price}`;
  });
  const total = list.reduce((s,o)=>s+parseInt(o.price||0),0);
  lines.push(`───────────\n總計：$${total}（共${list.length}筆）`);
  navigator.clipboard?.writeText(lines.join("\n")).then(()=>toast("📋 訂單清單已複製！")).catch(()=>toast("⚠ 複製失敗，請手動複製"));
}

// ── Lightbox ──────────────────────────────────────────
function openLightbox(src) {
  const lb = document.createElement("div");
  lb.className = "lightbox";
  lb.innerHTML = `<button class="lightbox-close" onclick="this.parentElement.remove()">✕</button><img src="${src}" alt="放大圖片">`;
  lb.onclick = (e) => { if(e.target===lb) lb.remove(); };
  document.body.appendChild(lb);
}

document.addEventListener("click", e => {
  const img = e.target.closest(".menu-img-wrap img");
  if (img) { e.stopPropagation(); openLightbox(img.src); }
});

// ── Init ──────────────────────────────────────────────
render();
loadSessions();
</script>
</body>
</html>
